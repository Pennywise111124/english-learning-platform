<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Topic Detail - LinguistAI</title>
    <link rel="stylesheet" href="css/style.css"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#004ac6", "error-container": "#ffdad6", "surface": "#f8f9ff",
                        "tertiary": "#ad0033", "surface-bright": "#f8f9ff", "primary-fixed": "#dbe1ff",
                        "surface-container-low": "#eff4ff", "on-secondary": "#ffffff", "tertiary-fixed-dim": "#ffb2b7",
                        "on-primary-container": "#eeefff", "on-surface-variant": "#434655", "on-primary-fixed": "#00174b",
                        "surface-container-high": "#dce9ff", "on-error": "#ffffff", "secondary-container": "#86f2e4",
                        "tertiary-container": "#d22348", "surface-container": "#e5eeff", "inverse-on-surface": "#eaf1ff",
                        "secondary": "#006a61", "on-primary": "#ffffff", "tertiary-fixed": "#ffdadb",
                        "error": "#ba1a1a", "on-background": "#0b1c30", "on-surface": "#0b1c30",
                        "secondary-fixed": "#89f5e7", "on-tertiary": "#ffffff", "on-tertiary-container": "#ffecec",
                        "background": "#f8f9ff", "on-tertiary-fixed-variant": "#92002a", "on-tertiary-fixed": "#40000d",
                        "surface-dim": "#cbdbf5", "surface-container-lowest": "#ffffff", "secondary-fixed-dim": "#6bd8cb",
                        "outline-variant": "#c3c6d7", "on-secondary-container": "#006f66", "on-secondary-fixed-variant": "#005049",
                        "on-secondary-fixed": "#00201d", "surface-container-highest": "#d3e4fe", "primary-container": "#2563eb",
                        "outline": "#737686", "on-primary-fixed-variant": "#003ea8", "surface-tint": "#0053db",
                        "inverse-surface": "#213145", "surface-variant": "#d3e4fe", "primary-fixed-dim": "#b4c5ff",
                        "inverse-primary": "#b4c5ff", "on-error-container": "#93000a"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "spacing": {
                        "stack-lg": "48px", "margin-desktop": "40px", "gutter": "24px", "stack-sm": "12px",
                        "unit": "8px", "container-max": "1280px", "margin-mobile": "16px", "stack-md": "24px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"], "headline-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"], "label-sm": ["Inter"], "body-md": ["Inter"], "display-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "1", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="font-body-md text-body-md antialiased min-h-screen flex flex-col bg-background text-on-background page-fade-in">
    <!-- TopNavBar -->
    <nav class="bg-surface/80 backdrop-blur-xl sticky top-0 shadow-sm z-50">
        <div class="flex justify-between items-center w-full px-margin-desktop max-w-container-max mx-auto h-16 border-b border-surface-container/80">
            <div class="font-display-lg text-[24px] font-bold text-primary cursor-pointer" onclick="window.location.href='index.html'">LinguistAI</div>
            <div class="hidden md:flex gap-gutter items-center">
                <a class="text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md" href="chat.html">Chat</a>
                <a class="text-primary font-bold border-b-2 border-primary pb-1 font-label-md text-label-md" href="topics.html">Topics</a>
                <a class="text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md" href="progress.html">Progress</a>
            </div>
            <div class="flex gap-unit items-center">
                <button class="text-on-surface-variant hover:bg-surface-container-high transition-all duration-200 active:scale-95 rounded-full p-2">
                    <span class="material-symbols-outlined">notifications</span>
                </button>
                <div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center ml-2 overflow-hidden cursor-pointer" onclick="window.location.href='profile.html'">
                    <img alt="User profile" class="w-full h-full object-cover" src="https://picsum.photos/seed/profile/200/200"/>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-stack-lg">
        <!-- Back Button -->
        <button onclick="window.location.href='topics.html'" class="flex items-center gap-2 text-primary hover:text-primary-container font-label-md text-label-md mb-stack-md transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
            Back to Topics
        </button>

        <!-- Topic Header -->
        <section id="topicHeader" class="bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-sm overflow-hidden mb-stack-lg">
            <!-- Content loaded dynamically -->
        </section>

        <!-- Entry Points -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-stack-lg">
            <!-- Flashcards Card -->
            <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-8 hover:shadow-lg transition-all cursor-pointer" onclick="document.getElementById('flashcardsSection').scrollIntoView({behavior: 'smooth'})">
                <div class="w-16 h-16 bg-primary/10 rounded-lg flex items-center justify-center mb-4">
                    <span class="material-symbols-outlined text-primary text-[32px]">style</span>
                </div>
                <h3 class="font-headline-md text-headline-md text-on-surface mb-2">Practice Flashcards</h3>
                <p class="font-body-md text-body-md text-on-surface-variant">Learn vocabulary with interactive flip cards</p>
            </div>

            <!-- Quiz Card -->
            <div id="quizCard" class="bg-surface-container-lowest border border-outline-variant rounded-xl p-8 hover:shadow-lg transition-all cursor-pointer">
                <div class="w-16 h-16 bg-secondary/10 rounded-lg flex items-center justify-center mb-4">
                    <span class="material-symbols-outlined text-secondary text-[32px]">quiz</span>
                </div>
                <h3 class="font-headline-md text-headline-md text-on-surface mb-2">Take Quiz</h3>
                <p class="font-body-md text-body-md text-on-surface-variant">Test your knowledge and track progress</p>
            </div>
        </section>

        <!-- Flashcards Section -->
        <section id="flashcardsSection" class="bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-sm p-8">
            <h2 class="font-headline-lg text-headline-lg text-on-surface mb-stack-md">Flashcards</h2>

            <div id="flashcardContainer" class="flex flex-col items-center gap-6">
                <div class="flashcard-wrapper w-full max-w-lg">
                    <div id="flashcard" class="flashcard bg-surface border border-outline-variant rounded-xl min-h-[300px] shadow-md">
                        <div class="flashcard-front bg-primary text-on-primary p-8">
                            <div class="text-center">
                                <p class="font-label-sm text-label-sm opacity-80 mb-2">WORD</p>
                                <h3 id="flashcardWord" class="font-display-lg text-[42px] font-bold"></h3>
                                <p class="font-label-sm text-label-sm opacity-80 mt-4">Click to flip</p>
                            </div>
                        </div>
                        <div class="flashcard-back bg-surface-container p-8">
                            <div class="text-center space-y-4">
                                <p class="font-label-sm text-label-sm text-on-surface-variant">MEANING</p>
                                <h3 id="flashcardMeaning" class="font-headline-lg text-headline-lg text-on-surface"></h3>
                                <div class="pt-4 border-t border-outline-variant/30">
                                    <p class="font-label-sm text-label-sm text-on-surface-variant mb-2">EXAMPLE</p>
                                    <p id="flashcardExample" class="font-body-md text-body-md text-on-surface italic"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between w-full max-w-lg">
                    <button id="prevBtn" class="px-6 py-3 bg-surface-container border border-outline-variant rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-high transition-all active:scale-95">
                        <span class="material-symbols-outlined">arrow_back</span>
                    </button>
                    <p id="flashcardCounter" class="font-label-md text-label-md text-on-surface-variant">1 / 5</p>
                    <button id="nextBtn" class="px-6 py-3 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-container transition-all active:scale-95">
                        <span class="material-symbols-outlined">arrow_forward</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-surface-container-low border-t border-outline-variant/30 py-stack-md mt-stack-lg">
        <div class="flex flex-col md:flex-row justify-between items-center px-margin-desktop max-w-container-max mx-auto gap-stack-sm">
            <div class="font-headline-sm text-label-md font-bold text-on-surface">LinguistAI</div>
            <div class="font-label-md text-label-md text-on-surface-variant">© 2024 LinguistAI. All rights reserved.</div>
        </div>
    </footer>

    <script type="module">
        import { checkAuth } from './js/auth.js';
        import * as api from './js/api.js';

        checkAuth();

        const params = new URLSearchParams(window.location.search);
        const topicId = params.get('id');

        if (!topicId) {
            window.location.href = 'topics.html';
        }

        let flashcards = [];
        let currentIndex = 0;

        async function loadTopic() {
            try {
                const topic = await api.getTopicDetail(topicId);

                const badgeColors = {
                    'BEGINNER': 'badge-beginner',
                    'INTERMEDIATE': 'badge-intermediate',
                    'ADVANCED': 'badge-advanced'
                };

                document.getElementById('topicHeader').innerHTML = `
                    <img src="${topic.imageUrl}" alt="${topic.title}" class="w-full h-64 object-cover"/>
                    <div class="p-8">
                        <div class="flex items-center gap-3 mb-4">
                            <h1 class="font-display-lg text-display-lg text-on-surface">${topic.title}</h1>
                            <span class="px-4 py-2 rounded-full font-label-md text-label-md ${badgeColors[topic.level]}">${topic.level}</span>
                        </div>
                        <p class="font-body-lg text-body-lg text-on-surface-variant">${topic.description}</p>
                    </div>
                `;

                flashcards = await api.getFlashcards(topicId);
                if (flashcards.length > 0) {
                    showFlashcard(0);
                }

                const quizzes = await api.getQuizzesByTopic(topicId);
                if (quizzes.length > 0) {
                    document.getElementById('quizCard').onclick = () => {
                        window.location.href = `quiz.html?topicId=${topicId}`;
                    };
                }
            } catch (error) {
                console.error('Failed to load topic:', error);
                document.getElementById('topicHeader').innerHTML = '<div class="p-8 text-center text-error">Failed to load topic</div>';
            }
        }

        function showFlashcard(index) {
            if (index < 0 || index >= flashcards.length) return;

            currentIndex = index;
            const card = flashcards[index];

            document.getElementById('flashcardWord').textContent = card.word;
            document.getElementById('flashcardMeaning').textContent = card.meaning;
            document.getElementById('flashcardExample').textContent = card.example;
            document.getElementById('flashcardCounter').textContent = `${index + 1} / ${flashcards.length}`;

            // Reset flip
            document.getElementById('flashcard').classList.remove('flipped');

            // Update button states
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === flashcards.length - 1;
        }

        document.getElementById('flashcard').addEventListener('click', function() {
            this.classList.toggle('flipped');
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) showFlashcard(currentIndex - 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < flashcards.length - 1) showFlashcard(currentIndex + 1);
        });

        loadTopic();
    </script>
</body>
</html>
