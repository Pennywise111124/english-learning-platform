<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Topic Detail - LinguistAI</title>
    <script>
      if (localStorage.getItem('linguistai_theme') === 'dark' ||
          (!localStorage.getItem('linguistai_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind-config.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="font-body-md text-body-md antialiased min-h-screen flex flex-col bg-background text-on-background page-fade-in">

    <div id="app-sidebar-container"></div>
    <div id="app-content" class="min-h-screen flex flex-col">
    <div id="app-topbar-container"></div>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop pt-stack-md pb-stack-lg">
        <!-- Back Button -->
        <button onclick="window.location.href='topics.html'" class="flex items-center gap-2 text-primary hover:text-primary-container font-label-md text-label-md mb-stack-md transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
            Back to Topics
        </button>

        <!-- Topic Header -->
        <section id="topicHeader" class="bg-surface-container-lowest rounded-xl border-2 border-outline-variant shadow-sm overflow-hidden mb-stack-lg">
            <div class="skeleton w-full h-64"></div>
            <div class="p-8 flex flex-col gap-3">
                <div class="flex items-center gap-3">
                    <div class="skeleton h-10 w-1/2"></div>
                    <div class="skeleton h-8 w-20 rounded-full"></div>
                </div>
                <div class="skeleton h-5 w-full"></div>
                <div class="skeleton h-5 w-4/5"></div>
            </div>
        </section>

        <!-- Entry Points -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-stack-lg">
            <!-- Flashcards Card -->
            <div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-8 hover:border-primary hover:-translate-y-1 transition-all cursor-pointer" onclick="document.getElementById('flashcardsSection').scrollIntoView({behavior: 'smooth'})">
                <div class="w-16 h-16 bg-primary-fixed rounded-2xl flex items-center justify-center mb-4">
                    <span class="material-symbols-outlined icon-filled text-primary text-[32px]">style</span>
                </div>
                <h3 class="font-headline-md text-headline-md text-on-surface mb-2">Practice Flashcards</h3>
                <p class="font-body-md text-body-md text-on-surface-variant">Learn vocabulary with interactive flip cards</p>
            </div>

            <!-- Quiz Card -->
            <div id="quizCard" class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-8 hover:border-secondary hover:-translate-y-1 transition-all cursor-pointer">
                <div class="w-16 h-16 bg-secondary-fixed rounded-2xl flex items-center justify-center mb-4">
                    <span class="material-symbols-outlined icon-filled text-secondary text-[32px]">quiz</span>
                </div>
                <h3 class="font-headline-md text-headline-md text-on-surface mb-2">Take Quiz</h3>
                <p class="font-body-md text-body-md text-on-surface-variant">Test your knowledge and track progress</p>
            </div>

            <!-- Dictation Card -->
            <button id="dictationCard" type="button"
                class="w-full text-left bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-8 hover:border-tertiary hover:-translate-y-1 transition-all focus:outline-none focus-visible:ring-4 focus-visible:ring-tertiary/30">
                <div class="w-16 h-16 bg-tertiary-fixed rounded-2xl flex items-center justify-center mb-4">
                    <span class="material-symbols-outlined icon-filled text-tertiary text-[32px]" aria-hidden="true">headphones</span>
                </div>
                <h3 class="font-headline-md text-headline-md text-on-surface mb-2">Dictation</h3>
                <p class="font-body-md text-body-md text-on-surface-variant">Listen and type what you hear</p>
                <p id="dictationCardMeta" class="font-label-md text-label-md text-on-surface-variant mt-3 min-h-[1.5rem]" aria-live="polite"></p>
            </button>
        </section>

        <!-- Flashcards Section -->
        <section id="flashcardsSection" class="bg-surface-container-lowest rounded-xl border-2 border-outline-variant shadow-sm p-8">
            <h2 class="font-headline-lg text-headline-lg text-on-surface mb-stack-md">Flashcards 🗂️</h2>
            
            <div id="flashcardSkeleton" class="flex flex-col items-center gap-6">
                <div class="skeleton w-full max-w-lg h-[300px] rounded-xl"></div>
                <div class="flex items-center justify-between w-full max-w-lg">
                    <div class="skeleton h-12 w-24 rounded-2xl"></div>
                    <div class="skeleton h-5 w-16"></div>
                    <div class="skeleton h-12 w-24 rounded-2xl"></div>
                </div>
            </div>

            <div id="flashcardContainer" class="hidden flex-col items-center gap-6">
                <div class="flashcard-wrapper w-full max-w-lg">
                    <div id="flashcard" class="flashcard bg-surface border-2 border-outline-variant rounded-xl min-h-[300px] shadow-md">
                        <div class="flashcard-front bg-primary text-on-primary p-8">
                            <button id="saveWordBtn" class="absolute top-4 right-4 text-on-primary hover:bg-on-primary/20 rounded-full p-2 transition-colors" title="Save word" onclick="event.stopPropagation()">
                                <span class="material-symbols-outlined">bookmark_add</span>
                            </button>
                            <div class="text-center">
                                <p class="font-label-sm text-label-sm opacity-80 mb-2">WORD</p>
                                <h3 id="flashcardWord" class="font-display-lg text-[42px] font-extrabold"></h3>
                                <p class="font-label-sm text-label-sm opacity-80 mt-4">Click to flip</p>
                            </div>
                        </div>
                        <div class="flashcard-back bg-surface-container p-8">
                            <div class="text-center space-y-4">
                                <p class="font-label-sm text-label-sm text-on-surface-variant">MEANING</p>
                                <h3 id="flashcardMeaning" class="font-headline-lg text-headline-lg text-on-surface"></h3>
                                <div class="pt-4 border-t-2 border-outline-variant">
                                    <p class="font-label-sm text-label-sm text-on-surface-variant mb-2">EXAMPLE</p>
                                    <p id="flashcardExample" class="font-body-md text-body-md text-on-surface italic"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between w-full max-w-lg">
                    <button id="prevBtn" class="px-6 py-3 bg-surface-container border-2 border-outline-variant rounded-2xl font-label-md text-label-md text-on-surface hover:bg-surface-container-high transition-all active:scale-95 disabled:opacity-40">
                        <span class="material-symbols-outlined">arrow_back</span>
                    </button>
                    <p id="flashcardCounter" class="font-label-md text-label-md text-on-surface-variant">1 / 5</p>
                    <button id="nextBtn" class="btn-3d px-6 py-3 bg-primary border-primary-shadow text-on-primary rounded-2xl font-label-md text-label-md hover:brightness-105 transition-all active:scale-95 disabled:opacity-40">
                        <span class="material-symbols-outlined">arrow_forward</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="app-footer-container"></div>
    </div>

    <script type="module">
        import * as api from './js/api.js';
        import { initNavBar } from './js/navbar.js';
        import { imageSrc } from './js/config.js';
        import { initAuthModal } from './js/authModal.js';
        import { showToast } from './js/toast.js';
        import { initFooter } from './js/footer.js';
        import { getUser } from './js/auth.js';
        import { el } from './js/ui.js';

        initNavBar('topics');
        initAuthModal();
        initFooter();

        const params = new URLSearchParams(window.location.search);
        const topicId = params.get('id');
        
        function promptLogin(redirectTo) {
            window.dispatchEvent(new CustomEvent('open-auth-modal', { detail: { mode: 'login', redirectTo } }));
        }

        if (!topicId) {
            window.location.href = 'topics.html';
        }

        let flashcards = [];
        let currentIndex = 0;
        let savedIds = new Set();
        
        function renderTopicHeader(topic) {
            const badgeColors = {
                BEGINNER: 'badge-beginner',
                INTERMEDIATE: 'badge-intermediate',
                ADVANCED: 'badge-advanced'
            };

            const img = el('img', 'w-full h-64 object-cover');
            img.src = imageSrc(topic.imageUrl);
            img.alt = topic.title;

            const titleRow = el('div', 'flex flex-wrap items-center gap-3 mb-4');
            titleRow.append(
                el('h1', 'font-display-lg text-display-lg text-on-surface break-words min-w-0', topic.title),
                el('span', `px-4 py-2 rounded-full font-label-md text-label-md ${badgeColors[topic.level] || ''}`, topic.level)
            );

            const body = el('div', 'p-8');
            body.append(titleRow, el('p', 'font-body-lg text-body-lg text-on-surface-variant', topic.description ?? ''));

            document.getElementById('topicHeader').replaceChildren(img, body);
        }

        async function loadTopic() {
            try {
                const topic = await api.getTopicDetail(topicId);

                renderTopicHeader(topic);

                flashcards = await api.getFlashcards(topicId);
                document.getElementById('flashcardSkeleton').classList.add('hidden');
                
                if (getUser()) {
                    try {
                        const ids = await api.getSavedFlashcardIds(topicId);
                        savedIds = new Set(ids);
                    } catch (error) {
                        console.error('Failed to load saved word ids:', error);
                    }
                }

                if (flashcards.length > 0) {
                    document.getElementById('flashcardContainer').classList.remove('hidden');
                    document.getElementById('flashcardContainer').classList.add('flex');
                    showFlashcard(0);
                } else {
                    document.getElementById('flashcardsSection').insertAdjacentHTML('beforeend',
                        '<p class="text-center text-on-surface-variant font-body-md py-8">No flashcards available for this topic yet.</p>');
                }
            } catch (error) {
                console.error('Failed to load topic:', error);
                document.getElementById('topicHeader').innerHTML = '<div class="p-8 text-center text-error">Failed to load topic</div>';
            }
        }

        function showFlashcard(index) {
            if (index < 0 || index >= flashcards.length) return;

            currentIndex = index;
            const card = flashcards[index];

            document.getElementById('flashcardWord').textContent = card.word;
            document.getElementById('flashcardMeaning').textContent = card.meaning;
            document.getElementById('flashcardExample').textContent = card.example;
            document.getElementById('flashcardCounter').textContent = `${index + 1} / ${flashcards.length}`;

            // Reset flip
            document.getElementById('flashcard').classList.remove('flipped');

            // Update button states
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === flashcards.length - 1;
            
            const btn = document.getElementById('saveWordBtn');
            const icon = btn.querySelector('.material-symbols-outlined');
            const isSaved = savedIds.has(card.id);
            icon.textContent = isSaved ? 'bookmark_added' : 'bookmark_add';
            icon.classList.toggle('icon-filled', isSaved);
        }

        document.getElementById('flashcard').addEventListener('click', function() {
            this.classList.toggle('flipped');
        });
        
        document.getElementById('saveWordBtn').addEventListener('click', async () => {
            if (!getUser()) {
                promptLogin(`topic-detail.html?id=${encodeURIComponent(topicId)}`); 
                return;
            }
            const btn = document.getElementById('saveWordBtn');
            const icon = btn.querySelector('.material-symbols-outlined');
            const card = flashcards[currentIndex];
            try {
                await api.saveVocabulary(card.id);
                savedIds.add(card.id);
                icon.textContent = 'bookmark_added';
                icon.classList.add('icon-filled');
                showToast('Word saved to your vocabulary', 'success');
            } catch (error) {
                if (error.message === 'Word is already saved') {
                    savedIds.add(card.id);
                    icon.textContent = 'bookmark_added';
                    icon.classList.add('icon-filled');
                    showToast('Already saved', 'info');
                } else {
                    showToast(error.message || 'Failed to save word', 'error');
                }
            }
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) showFlashcard(currentIndex - 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < flashcards.length - 1) showFlashcard(currentIndex + 1);
        });
        
        async function loadDictationCard() {
            const card = document.getElementById('dictationCard');
            const meta = document.getElementById('dictationCardMeta');
            const isGuest = !getUser();
            let lessonCount = null;   // null = chưa biết (chưa tải xong hoặc lỗi mạng): vẫn cho vào trang Dictation

            // Gắn sự kiện ngay từ đầu, bấm sớm khi dữ liệu chưa về vẫn đi đúng chỗ
            card.addEventListener('click', () => {
                if (isGuest) {
                    promptLogin(`dictation.html?topicId=${encodeURIComponent(topicId)}`);
                } else if (lessonCount === 0) {
                    showToast('No dictation lessons available for this topic yet', 'info');
                } else {
                    window.location.href = `dictation.html?topicId=${encodeURIComponent(topicId)}`;
                }
            });

            if (isGuest) {
                meta.textContent = 'Log in to practice';   // không gọi API: khách sẽ bị chuyển sang trang đăng nhập khi gặp 401
                return;
            }

            try {
                const data = await api.getDictationCatalog({ topicId, size: 1 });   // chỉ cần totalElements
                lessonCount = data.totalElements;
                meta.textContent = lessonCount === 0
                    ? 'No lessons yet'
                    : `${lessonCount} lesson${lessonCount === 1 ? '' : 's'}`;
            } catch (error) {
                console.error('Failed to load dictation lessons:', error);   // lỗi phụ, không làm hỏng phần còn lại của trang
            }
        }
        
        function setupQuizCard() {
            const card = document.getElementById('quizCard');
            let quizCount = null;   

            card.addEventListener('click', () => {
                const quizUrl = `quiz.html?topicId=${encodeURIComponent(topicId)}`;
                if (!getUser()) {
                    promptLogin(quizUrl);   
                } else if (quizCount === 0) {
                    showToast('No quizzes available for this topic yet', 'info');
                } else {
                    window.location.href = quizUrl;
                }
            });

            api.getQuizzesByTopic(topicId)
                .then(quizzes => { quizCount = quizzes.length; })
                .catch(error => console.error('Failed to load quizzes:', error));
        }

        loadTopic();
        if (topicId) {
            setupQuizCard();
            loadDictationCard();
        }
    </script>
</body>
</html>
