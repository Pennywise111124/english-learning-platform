<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>User Profile - LinguistAI</title>
    <script>
      if (localStorage.getItem('linguistai_theme') === 'dark' ||
          (!localStorage.getItem('linguistai_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind-config.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css"/>
    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col page-fade-in">

    <div id="app-sidebar-container"></div>
    <div id="app-content" class="min-h-screen flex flex-col">
    <div id="app-topbar-container"></div>

    <!-- Main Content -->
    <main class="flex-grow w-full px-gutter md:px-margin-desktop max-w-container-max mx-auto pt-stack-md pb-stack-lg">
        <div class="max-w-4xl mx-auto">
            <div class="mb-stack-md">
                <h1 class="font-headline-lg text-headline-lg text-on-surface">Profile Settings ⚙️</h1>
                <p class="font-body-md text-on-surface-variant mt-2">Manage your account details and password.</p>
            </div>

            <div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl shadow-sm overflow-hidden flex flex-col md:flex-row">
                <!-- Left Column: Avatar -->
                <div class="w-full md:w-1/3 p-stack-md border-b-2 md:border-b-0 md:border-r-2 border-outline-variant bg-surface-container-low flex flex-col items-center justify-center text-center">
                    <div class="w-32 h-32 rounded-full border-4 border-primary shadow-sm mb-4 overflow-hidden bg-surface-container-high relative group">
                        <img id="avatarImage" class="w-full h-full object-cover" src="https://picsum.photos/seed/default/200/200" alt="Profile avatar"/>
                        <div class="absolute inset-0 bg-on-surface/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                            <span class="material-symbols-outlined text-on-primary">photo_camera</span>
                        </div>
                    </div>
                    <input type="file" id="avatarInput" accept="image/*" class="hidden"/>
                    <button id="uploadAvatarBtn" class="font-label-md text-primary hover:text-on-primary-fixed-variant border-2 border-primary/30 bg-primary-fixed/40 hover:bg-primary-fixed px-4 py-2 rounded-2xl transition-colors w-full max-w-[200px]">
                        Upload new photo
                    </button>
                    <p class="font-label-sm text-on-surface-variant mt-4 opacity-80">
                        Recommended: Square JPG or PNG, max 2MB.
                    </p>
                </div>

                <!-- Right Column: Details & Password -->
                <div class="w-full md:w-2/3 p-stack-md flex flex-col gap-stack-md">
                    <!-- Profile Info Section -->
                    <div>
                        <h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Profile Information</h2>
                        <div class="flex flex-col gap-stack-sm">
                            <div>
                                <label class="block font-label-md text-on-surface mb-unit">Username</label>
                                <input id="username" type="text" readonly class="w-full bg-surface-container-low border-2 border-outline-variant rounded-2xl px-4 py-3 font-body-md text-on-background cursor-not-allowed" placeholder="Loading..."/>
                            </div>
                            <div>
                                <label class="block font-label-md text-on-surface mb-unit">Email</label>
                                <input id="email" type="email" readonly class="w-full bg-surface-container-low border-2 border-outline-variant rounded-2xl px-4 py-3 font-body-md text-on-background cursor-not-allowed" placeholder="Loading..."/>
                            </div>
                            <div>
                                <label class="block font-label-md text-on-surface mb-unit">Role</label>
                                <span id="role" class="inline-block px-3 py-1 bg-primary-fixed text-on-primary-fixed rounded-full font-label-sm font-bold">USER</span>
                            </div>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="border-t-2 border-outline-variant"></div>
                    
                    <!-- Timezone Section -->
                    <div>
                        <h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Timezone</h2>
                        <p class="font-body-md text-on-surface-variant mb-stack-sm">Used to decide when your day starts for streaks.</p>
                        <div class="flex flex-col gap-stack-sm">
                            <select id="timezoneSelect" class="w-full bg-surface-container-low border-2 border-outline-variant rounded-2xl px-4 py-3 font-body-md text-on-background focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"></select>
                            <div class="flex flex-col sm:flex-row gap-3">
                                <button id="detectTimezoneBtn" type="button" class="flex-1 border-2 border-outline-variant text-on-surface font-label-md rounded-2xl py-3 hover:bg-surface-container-low transition-colors">Use my browser's timezone</button>
                                <button id="saveTimezoneBtn" type="button" class="btn-3d flex-1 bg-primary border-primary-shadow text-on-primary font-label-md rounded-2xl py-3 hover:brightness-105 transition-all">Save timezone</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Divider -->
                    <div class="border-t-2 border-outline-variant"></div>

                    <!-- Leaderboard Privacy Section -->
                    <div>
                        <h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Leaderboard</h2>
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input id="leaderboardVisible" type="checkbox" class="mt-1 w-5 h-5 rounded accent-primary"/>
                            <span>
                                <span class="block font-label-md text-on-surface">Show my username on the weekly leaderboard</span>
                                <span class="block font-body-sm text-on-surface-variant">When off, others cannot see you. You still see your own rank.</span>
                            </span>
                        </label>
                    </div>

                    <!-- Divider -->
                    <div class="border-t-2 border-outline-variant"></div>

                    <!-- Change Password Section -->
                    <div>
                        <h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Change Password</h2>
                        <form id="changePasswordForm" class="flex flex-col gap-stack-sm">
                            <div>
                                <label class="block font-label-md text-on-surface mb-unit" for="currentPassword">Current Password</label>
                                <input id="currentPassword" type="password" class="w-full bg-surface-container-low border-2 border-outline-variant rounded-2xl px-4 py-3 font-body-md text-on-background focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Enter current password"/>
                            </div>
                            <div>
                                <label class="block font-label-md text-on-surface mb-unit" for="newPassword">New Password</label>
                                <input id="newPassword" type="password" class="w-full bg-surface-container-low border-2 border-outline-variant rounded-2xl px-4 py-3 font-body-md text-on-background focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Enter new password"/>
                            </div>
                            <div>
                                <label class="block font-label-md text-on-surface mb-unit" for="confirmPassword">Confirm New Password</label>
                                <input id="confirmPassword" type="password" class="w-full bg-surface-container-low border-2 border-outline-variant rounded-2xl px-4 py-3 font-body-md text-on-background focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Confirm new password"/>
                            </div>
                            <button type="submit" class="btn-3d w-full bg-primary border-primary-shadow text-on-primary font-label-md rounded-2xl py-3 hover:brightness-105 transition-all">
                                Update Password
                            </button>
                        </form>
                    </div>

                    <!-- Divider -->
                    <div class="border-t-2 border-outline-variant"></div>

                    <!-- Stats Section -->
                    <div>
                        <h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Learning Stats</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-primary-fixed border-2 border-primary/20 rounded-2xl p-4 text-center">
                                <div class="font-headline-lg text-headline-lg text-on-primary-fixed" id="quizzesTaken">—</div>
                                <div class="font-label-md text-on-primary-fixed-variant">Quizzes Taken</div>
                            </div>
                            <div class="bg-secondary-fixed border-2 border-secondary/20 rounded-2xl p-4 text-center">
                                <div class="font-headline-lg text-headline-lg text-on-secondary-fixed" id="topicsCompleted">—</div>
                                <div class="font-label-md text-on-secondary-fixed-variant">Topics Completed</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="app-footer-container"></div>
    </div>

        <script type="module">
        import { checkAuth } from './js/auth.js';
        import * as api from './js/api.js';
        import { initNavBar } from './js/navbar.js';
        import { imageSrc } from './js/config.js';
        import { showToast } from './js/toast.js';
        import { initFooter } from './js/footer.js';

        checkAuth();
        initNavBar('');
        initFooter();
        
        const FALLBACK_ZONES = ['Asia/Ho_Chi_Minh', 'Asia/Bangkok', 'Asia/Tokyo', 'Asia/Seoul', 'Asia/Singapore',
            'Asia/Kolkata', 'Europe/London', 'Europe/Paris', 'America/New_York', 'America/Chicago',
            'America/Los_Angeles', 'Australia/Sydney', 'UTC'];

        function listTimezones() {
            let zones = FALLBACK_ZONES;
            try {
                const fromBrowser = Intl.supportedValuesOf('timeZone');
                if (fromBrowser.length) zones = fromBrowser;
            } catch { /* trình duyệt cũ: dùng danh sách dự phòng */ }
            return zones.includes('UTC') ? zones : [...zones, 'UTC'];
        }

        function setupTimezone(current) {
            const select = document.getElementById('timezoneSelect');
            const zones = listTimezones();
            const all = zones.includes(current) ? zones : [current, ...zones];
            select.replaceChildren(...all.map(z => {
                const option = document.createElement('option');
                option.value = z;
                option.textContent = z;
                return option;
            }));
            select.value = current;
        }

        document.getElementById('detectTimezoneBtn').addEventListener('click', () => {
            const select = document.getElementById('timezoneSelect');
            const detected = Intl.DateTimeFormat().resolvedOptions().timeZone;
            if (detected && [...select.options].some(o => o.value === detected)) {
                select.value = detected;
            } else {
                showToast('Could not detect a supported timezone', 'error');
            }
        });

        document.getElementById('saveTimezoneBtn').addEventListener('click', async () => {
            try {
                const updated = await api.updateTimezone(document.getElementById('timezoneSelect').value);
                showToast(`Timezone saved: ${updated.timezone}`, 'success');
            } catch (error) {
                console.error('[saveTimezone]', error);
                showToast(error.message || 'Failed to save timezone', 'error');
            }
        });

        async function loadProfile() {
            try {
                const profile = await api.getProfile();
                document.getElementById('username').value = profile.username;
                document.getElementById('email').value = profile.email;
                document.getElementById('role').textContent = profile.role;
                document.getElementById('avatarImage').src = imageSrc(profile.avatarUrl);
                setupTimezone(profile.timezone); 
                document.getElementById('leaderboardVisible').checked = profile.leaderboardVisible;
            } catch (error) {
                showToast('Failed to load profile', 'error');
                document.getElementById('username').placeholder = 'Failed to load';
                document.getElementById('email').placeholder = 'Failed to load';
            }
        }

        async function loadStats() {
            try {
                const [progress, attempts] = await Promise.all([
                    api.getProgress(),
                    api.getMyRecentQuizAttempts(0, 1) // chỉ cần totalElements, không cần nội dung
                ]);

                const topicsCompleted = progress.filter(p => p.status === 'COMPLETED').length;
                document.getElementById('topicsCompleted').textContent = topicsCompleted;
                document.getElementById('quizzesTaken').textContent = attempts.totalElements;
            } catch (error) {
                console.error('Failed to load stats:', error);
                document.getElementById('quizzesTaken').textContent = '—';
                document.getElementById('topicsCompleted').textContent = '—';
            }
        }

        document.getElementById('uploadAvatarBtn').addEventListener('click', () => {
            document.getElementById('avatarInput').click();
        });

        document.getElementById('avatarInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 2 * 1024 * 1024) {
                showToast('File size must be less than 2MB', 'error');
                return;
            }

            try {
                const result = await api.uploadAvatar(file); // truyền thẳng File, api.js tự đóng gói FormData đúng key
                document.getElementById('avatarImage').src = imageSrc(result.avatarUrl);
                showToast('Avatar updated successfully!', 'success');
            } catch (error) {
                showToast(error.message || 'Failed to upload avatar', 'error');
            }
        });
        
        document.getElementById('leaderboardVisible').addEventListener('change', async (e) => {
            const box = e.target;
            const wanted = box.checked;
            box.disabled = true;
            try {
                const updated = await api.updateLeaderboardVisibility(wanted);
                showToast(updated.leaderboardVisible ? 'You are visible on the leaderboard' : 'You are hidden from the leaderboard', 'success');
            } catch (error) {
                console.error('[updateLeaderboardVisibility]', error);
                box.checked = !wanted; // trả về trạng thái thật của server
                showToast(error.message || 'Failed to update leaderboard setting', 'error');
            } finally {
                box.disabled = false;
            }
        });

        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showToast('New passwords do not match', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                return;
            }

            try {
                await api.changePassword(currentPassword, newPassword);
                showToast('Password updated successfully!', 'success');
                e.target.reset();
            } catch (error) {
                showToast(error.message || 'Failed to change password', 'error');
            }
        });

        loadProfile();
        loadStats();
    </script>
</body>
</html>
