<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>LinguistAI - Leaderboard</title>
    <script>
      if (localStorage.getItem('linguistai_theme') === 'dark' ||
          (!localStorage.getItem('linguistai_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind-config.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col page-fade-in">

    <div id="app-sidebar-container"></div>
    <div id="app-content" class="min-h-screen flex flex-col">
    <div id="app-topbar-container"></div>

    <main class="flex-grow pt-stack-md pb-stack-lg px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto w-full flex flex-col gap-stack-md">
        <header>
            <h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Weekly Leaderboard 🏆</h1>
            <p id="weekRange" class="font-body-md text-body-md text-on-surface-variant">&nbsp;</p>
        </header>

        <section id="meCard" class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-6 shadow-sm">
            <div class="skeleton h-8 w-1/3"></div>
        </section>

        <section>
            <ol id="entryList" class="flex flex-col gap-3"></ol>
            <p id="listError" class="hidden text-center text-error font-body-md py-6"></p>
        </section>
    </main>

    <div id="app-footer-container"></div>
    </div>

    <script type="module">
        import { checkAuth } from './js/auth.js';
        import * as api from './js/api.js';
        import { initNavBar } from './js/navbar.js';
        import { initFooter } from './js/footer.js';
        import { el } from './js/ui.js';

        checkAuth();
        initNavBar('leaderboard');
        initFooter();

        function renderSkeletons() {
            const list = document.getElementById('entryList');
            list.replaceChildren(...Array.from({ length: 5 }, () =>
                el('li', 'skeleton h-16 w-full rounded-xl')));
        }

        function renderMe(me) {
            const card = document.getElementById('meCard');
            card.replaceChildren();

            const row = el('div', 'flex flex-col md:flex-row md:items-center justify-between gap-4');
            const left = el('div', 'flex flex-col gap-1');
            left.append(el('p', 'font-label-sm text-label-sm text-on-surface-variant uppercase', 'Your rank this week'));
            left.append(el('p', 'font-headline-lg text-headline-lg text-on-surface',
                me.rank === null ? '—' : '#' + me.rank));
            row.append(left);

            const right = el('div', 'flex flex-col gap-1 md:text-right');
            right.append(el('p', 'font-headline-md text-headline-md text-primary', me.xp.toLocaleString() + ' XP'));
            right.append(el('p', 'font-body-sm text-body-sm text-on-surface-variant',
                me.rank === null ? 'Earn XP this week to join the ranking.' : 'XP earned this week'));
            row.append(right);
            card.append(row);

            if (!me.visible) {
                const note = el('p', 'font-body-sm text-body-sm text-on-surface-variant mt-4 border-t-2 border-outline-variant pt-3',
                    'You are hidden from the leaderboard. Others cannot see you, but your rank above is still counted. ');
                const link = el('a', 'text-primary font-bold hover:underline', 'Change in Profile');
                link.href = 'profile.html';
                note.append(link);
                card.append(note);
            }
        }

        function renderEntries(entries) {
            const list = document.getElementById('entryList');
            list.replaceChildren();

            if (entries.length === 0) {
                list.append(el('li', 'text-center text-on-surface-variant font-body-md py-8',
                    'Nobody has earned XP this week yet. Be the first!'));
                return;
            }

            entries.forEach(e => {
                const li = el('li', 'flex items-center gap-4 rounded-xl border-2 px-4 py-3 '
                    + (e.me ? 'bg-primary-fixed border-primary' : 'bg-surface-container-lowest border-outline-variant'));
                li.append(el('span', 'w-10 text-center font-headline-md text-headline-md '
                    + (e.rank <= 3 ? 'text-tertiary' : 'text-on-surface-variant'), String(e.rank)));
                li.append(el('span', 'flex-1 min-w-0 truncate font-label-md text-label-md text-on-surface',
                    e.me ? `${e.username} (you)` : e.username));
                li.append(el('span', 'font-label-md text-label-md font-bold text-primary', e.xp.toLocaleString() + ' XP'));
                list.append(li);
            });
        }

        async function load() {
            renderSkeletons();
            try {
                const data = await api.getWeeklyLeaderboard();
                document.getElementById('weekRange').textContent = `Week of ${data.weekStart} to ${data.weekEnd}`;
                renderMe(data.me);
                renderEntries(data.entries);
            } catch (error) {
                console.error('[loadLeaderboard]', error);
                document.getElementById('entryList').replaceChildren();
                const err = document.getElementById('listError');
                err.textContent = 'Failed to load leaderboard: ' + error.message;
                err.classList.remove('hidden');
                document.getElementById('meCard').replaceChildren();
            }
        }

        load();
    </script>
</body>
