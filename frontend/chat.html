<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>LinguistAI - English Tutor</title>
    <!-- Chống nháy sáng/tối lúc tải trang -->
    <script>
        if (localStorage.getItem('linguistai_theme') === 'dark' ||
            (!localStorage.getItem('linguistai_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,typography"></script>
    <script src="js/tailwind-config.js"></script>
    <!-- Markdown rendering cho tin nhắn AI -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <!-- WebSocket (STOMP over SockJS) cho AI Chat streaming -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #B2F296;
            border-radius: 9999px;
            border: 2px solid #ffffff;
        }
    </style>
</head>

<body class="bg-background text-on-background min-h-screen antialiased">
    <div id="app-sidebar-container"></div>

    <div id="app-content" class="min-h-screen flex flex-col">
        <div id="app-topbar-container"></div>

        <!-- Main Workspace -->
        <main
            class="flex-grow pt-stack-md pb-stack-md px-gutter max-w-container-max mx-auto w-full flex gap-gutter h-[calc(100vh-80px)]">

            <!-- Backdrop cho sidebar dạng drawer trên mobile -->
            <div id="sidebarBackdrop" class="hidden fixed inset-0 bg-on-surface/40 z-30 md:hidden"></div>

            <!-- Left Sidebar: Conversations History -->
            <aside id="conversationsSidebar"
                class="hidden md:flex w-[320px] flex-shrink-0 flex-col bg-surface-container-lowest rounded-xl border-2 border-outline-variant shadow-sm overflow-hidden">
                <div class="p-4 border-b-2 border-outline-variant">
                    <button id="newConversationBtn"
                        class="btn-3d w-full bg-primary border-primary-shadow text-on-primary font-label-md text-label-md py-3 px-4 rounded-2xl flex items-center justify-center gap-2 hover:brightness-105 transition-all">
                        <span class="material-symbols-outlined text-[20px]">add_circle</span>
                        New Conversation
                    </button>
                </div>
                <div id="conversationsList" class="flex-grow overflow-y-auto p-2">
                    <!-- Conversations loaded dynamically -->
                </div>
            </aside>

            <!-- Main Chat Panel -->
            <section
                class="flex-grow flex flex-col bg-surface-container-lowest rounded-xl border-2 border-outline-variant shadow-sm overflow-hidden">
                <!-- Chat Header -->
                <div class="h-16 flex items-center px-6 border-b-2 border-outline-variant bg-surface/50">
                    <div class="flex items-center gap-3 min-w-0 flex-1">
                        <button id="mobileSidebarToggle"
                            class="md:hidden p-2 -ml-2 text-on-surface-variant hover:text-primary rounded-xl hover:bg-surface-container-low transition-colors flex-shrink-0">
                            <span class="material-symbols-outlined">menu</span>
                        </button>
                        <div class="min-w-0 flex-1">
                            <h2 id="conversationTitle"
                                class="font-headline-md text-body-lg font-bold text-on-surface truncate">
                                Select or start a conversation</h2>
                            <p class="font-label-sm text-label-sm text-on-surface-variant mt-0.5 truncate">Practice
                                English with AI</p>
                        </div>
                    </div>
                </div>

                <!-- Messages Area -->
                <div id="messagesArea"
                    class="flex-grow overflow-y-auto p-6 flex flex-col gap-6 bg-surface-bright chat-messages">
                    <div class="text-center text-on-surface-variant font-body-md">
                        Hi there! I'm your AI English Assistant. How can I help you practice your English today?
                    </div>
                </div>

                <!-- Input Area -->
                <div class="p-4 border-t-2 border-outline-variant bg-surface-container-lowest">
                    <div class="relative flex items-end gap-2">
                        <button
                            class="p-3 text-outline hover:text-primary hover:bg-surface-container-low rounded-full transition-colors flex-shrink-0 mb-1">
                            <span class="material-symbols-outlined">mic</span>
                        </button>
                        <div
                            class="flex-grow relative bg-surface-container-low rounded-2xl border-2 border-outline-variant focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all overflow-hidden">
                            <textarea id="messageInput"
                                class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface py-4 pl-4 pr-12 resize-none max-h-32 min-h-[56px]"
                                placeholder="Type your message here..." rows="1"></textarea>
                        </div>
                        <button id="sendBtn"
                            class="btn-3d p-3 bg-primary border-primary-shadow text-on-primary rounded-full hover:brightness-105 transition-all flex-shrink-0 mb-1">
                            <span class="material-symbols-outlined">send</span>
                        </button>
                    </div>
                    <div class="text-center mt-2">
                        <span class="font-label-sm text-[11px] text-outline">Press Enter to send, Shift + Enter for new
                            line. Responses are AI-generated.</span>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <div id="app-footer-container"></div>
    </div>

    <script type="module">
        import { checkAuth } from './js/auth.js';
        import * as api from './js/api.js';
        import { initNavBar } from './js/navbar.js';
        import { connectChat, subscribeConversation, unsubscribeConversation, sendChatMessage } from './js/chat.js';
        import { initFooter } from './js/footer.js';

        checkAuth();
        initNavBar('chat');
        initFooter();

        let currentConversationId = null;
        let liveBubbleEl = null;
        let thinkingBubbleEl = null;

        function displayTitle(title) {
            return title || 'New conversation';
        }

        // ── Render helpers ──

        function renderConversationSkeletons(count = 5) {
            document.getElementById('conversationsList').innerHTML = Array.from({ length: count }).map(() => `
                <div class="px-3 py-3 mb-1 flex flex-col gap-2">
                    <div class="skeleton h-4 w-3/4"></div>
                    <div class="skeleton h-3 w-1/2"></div>
                </div>
            `).join('');
        }

        function renderMessageSkeletons() {
            document.getElementById('messagesArea').innerHTML = `
                <div class="flex gap-4 max-w-[85%]">
                    <div class="skeleton w-8 h-8 rounded-full flex-shrink-0"></div>
                    <div class="skeleton h-16 w-64 rounded-2xl"></div>
                </div>
                <div class="flex gap-4 max-w-[85%] ml-auto justify-end">
                    <div class="skeleton h-12 w-48 rounded-2xl"></div>
                </div>
                <div class="flex gap-4 max-w-[85%]">
                    <div class="skeleton w-8 h-8 rounded-full flex-shrink-0"></div>
                    <div class="skeleton h-20 w-72 rounded-2xl"></div>
                </div>
            `;
        }

        function renderUserBubble(content) {
            const div = document.createElement('div');
            div.className = 'flex gap-4 max-w-[85%] ml-auto justify-end';
            div.innerHTML = `
                <div class="flex flex-col gap-1 items-end">
                    <span class="font-label-sm text-label-sm text-on-surface-variant mr-1">You</span>
                    <div class="bg-primary text-on-primary font-body-md text-body-md p-4 rounded-2xl rounded-tr-sm shadow-md">
                        <p class="whitespace-pre-wrap">${escapeHtml(content)}</p>
                    </div>
                </div>
            `;
            return div;
        }

        function renderAiBubbleShell() {
            const div = document.createElement('div');
            div.className = 'flex gap-4 max-w-[85%]';
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-secondary-fixed text-secondary flex items-center justify-center flex-shrink-0 mt-1">
                    <span class="material-symbols-outlined text-[18px]">smart_toy</span>
                </div>
                <div class="flex flex-col gap-1 w-full">
                    <span class="font-label-sm text-label-sm text-on-surface-variant ml-1">AI Tutor</span>
                    <div class="ai-bubble-content bg-surface-container-low text-on-surface font-body-md text-body-md p-4 rounded-2xl rounded-tl-sm border-2 border-outline-variant w-full">
                        <p class="ai-bubble-text whitespace-pre-wrap"></p>
                    </div>
                </div>
            `;
            return div;
        }

        function renderThinkingBubble() {
            const div = document.createElement('div');
            div.className = 'flex gap-4 max-w-[85%]';
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-secondary-fixed text-secondary flex items-center justify-center flex-shrink-0 mt-1">
                    <span class="material-symbols-outlined text-[18px]">smart_toy</span>
                </div>
                <div class="flex flex-col gap-1 w-full">
                    <span class="font-label-sm text-label-sm text-on-surface-variant ml-1">AI Tutor</span>
                    <div class="bg-surface-container-low p-4 rounded-2xl rounded-tl-sm border-2 border-outline-variant inline-flex items-center gap-1.5 w-fit">
                        <span class="w-2 h-2 rounded-full bg-primary animate-bounce" style="animation-delay:0ms"></span>
                        <span class="w-2 h-2 rounded-full bg-primary animate-bounce" style="animation-delay:150ms"></span>
                        <span class="w-2 h-2 rounded-full bg-primary animate-bounce" style="animation-delay:300ms"></span>
                    </div>
                </div>
            `;
            return div;
        }

        function fillAiBubble(bubbleEl, msg) {
            const content = bubbleEl.querySelector('.ai-bubble-content');
            const safeHtml = DOMPurify.sanitize(marked.parse(msg.content || ''));
            content.innerHTML = `
                <div class="prose prose-sm dark:prose-invert max-w-none prose-p:my-2 prose-headings:my-2">${safeHtml}</div>
                ${msg.correction ? `
                    <div class="mt-4 bg-tertiary-fixed border-2 border-tertiary rounded-xl p-3 flex gap-3 items-start">
                        <span class="material-symbols-outlined text-tertiary text-[20px] mt-0.5">lightbulb</span>
                        <div class="flex flex-col gap-1">
                            <span class="font-label-md text-label-md font-bold text-on-surface">Grammar Tip</span>
                            <p class="font-body-md text-[14px] text-on-surface-variant leading-snug">
                                <span class="font-bold text-tertiary">Corrected:</span> ${escapeHtml(msg.correction)}<br/>
                                ${msg.explanation ? `<span class="text-on-surface-variant">${escapeHtml(msg.explanation)}</span>` : ''}
                            </p>
                        </div>
                    </div>
                ` : ''}
            `;
        }

        function openMobileSidebar() {
            document.getElementById('conversationsSidebar').classList.remove('hidden');
            document.getElementById('conversationsSidebar').classList.add('fixed', 'inset-y-0', 'left-0', 'z-40', 'w-[85%]', 'max-w-[320px]', 'rounded-none', 'border-none', 'shadow-2xl');
            document.getElementById('sidebarBackdrop').classList.remove('hidden');
        }

        function closeMobileSidebar() {
            const sidebar = document.getElementById('conversationsSidebar');
            if (window.innerWidth < 768) {
                sidebar.classList.add('hidden');
            }
            sidebar.classList.remove('fixed', 'inset-y-0', 'left-0', 'z-40', 'w-[85%]', 'max-w-[320px]', 'rounded-none', 'border-none', 'shadow-2xl');
            document.getElementById('sidebarBackdrop').classList.add('hidden');
        }

        document.getElementById('mobileSidebarToggle').addEventListener('click', openMobileSidebar);
        document.getElementById('sidebarBackdrop').addEventListener('click', closeMobileSidebar);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeMobileSidebar();
        });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function clearThinkingIndicator() {
            if (thinkingBubbleEl) {
                thinkingBubbleEl.remove();
                thinkingBubbleEl = null;
            }
        }

        function highlightSidebar(id) {
            document.querySelectorAll('.sidebar-item').forEach(el => {
                const match = Number(el.dataset.convId) === id;
                el.classList.toggle('active', match);
                el.classList.toggle('bg-surface-container-low', match);
                el.classList.toggle('border-primary', match);
            });
        }

        function showBlankComposeState() {
            currentConversationId = null;
            liveBubbleEl = null;
            thinkingBubbleEl = null;
            unsubscribeConversation();
            document.getElementById('conversationTitle').textContent = 'Select or start a conversation';
            document.getElementById('messagesArea').innerHTML =
                '<div class="text-center text-on-surface-variant font-body-md">Type a message below to start a new conversation</div>';
            highlightSidebar(null);
        }

        // ── Conversations list (REST) ──

        async function loadConversations() {
            try {
                renderConversationSkeletons();
                const data = await api.getConversations();
                const list = document.getElementById('conversationsList');
                list.innerHTML = '';

                if (data.content.length === 0) {
                    list.innerHTML = '<p class="text-center text-on-surface-variant font-label-sm p-4">No conversations yet</p>';
                    return;
                }

                data.content.forEach(conv => {
                    const btn = document.createElement('button');
                    btn.dataset.convId = conv.id;
                    btn.className = 'w-full min-w-0 text-left px-3 py-3 rounded-xl hover:bg-surface-container-low transition-colors mb-1 flex flex-col items-start gap-1 border-l-4 border-transparent sidebar-item';
                    btn.innerHTML = `
                        <span class="block w-full max-w-full truncate font-label-md text-label-md text-on-surface pr-2">${displayTitle(conv.title)}</span>
                        <span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
                            <span class="material-symbols-outlined text-[14px]">schedule</span>
                            ${new Date(conv.updatedAt).toLocaleDateString()}
                        </span>
                    `;
                    btn.onclick = () => loadConversation(conv.id);
                    list.appendChild(btn);
                });

                highlightSidebar(currentConversationId);
            } catch (error) {
                console.error('Failed to load conversations:', error);
            }
        }

        async function loadConversation(id) {
            currentConversationId = id;
            liveBubbleEl = null;
            thinkingBubbleEl = null;

            closeMobileSidebar();
            renderMessageSkeletons();

            try {
                const conv = await api.getConversation(id);
                document.getElementById('conversationTitle').textContent = displayTitle(conv.title);

                const messages = await api.getMessages(id);
                const area = document.getElementById('messagesArea');
                area.innerHTML = '';

                messages.forEach(msg => {
                    if (msg.sender === 'USER') {
                        area.appendChild(renderUserBubble(msg.content));
                    } else {
                        const bubble = renderAiBubbleShell();
                        fillAiBubble(bubble, msg);
                        area.appendChild(bubble);
                    }
                });

                area.scrollTop = area.scrollHeight;
                highlightSidebar(id);

                subscribeConversation(id, {
                    onTypingChunk: handleTypingChunk,
                    onDone: handleDone,
                });
            } catch (error) {
                console.error('Failed to load conversation:', error);
            }
        }

        function handleTypingChunk(text) {
            clearThinkingIndicator();
            const area = document.getElementById('messagesArea');
            if (!liveBubbleEl) {
                liveBubbleEl = renderAiBubbleShell();
                area.appendChild(liveBubbleEl);
            }
            const textEl = liveBubbleEl.querySelector('.ai-bubble-text');
            textEl.textContent += text;
            area.scrollTop = area.scrollHeight;
        }

        async function handleDone(message) {
            clearThinkingIndicator();
            const area = document.getElementById('messagesArea');
            if (!liveBubbleEl) {
                liveBubbleEl = renderAiBubbleShell();
                area.appendChild(liveBubbleEl);
            }
            fillAiBubble(liveBubbleEl, message);
            liveBubbleEl = null;
            area.scrollTop = area.scrollHeight;

            if (currentConversationId) {
                try {
                    const conv = await api.getConversation(currentConversationId);
                    document.getElementById('conversationTitle').textContent = displayTitle(conv.title);
                } catch (error) {
                    console.error('Failed to refresh conversation title:', error);
                }
                loadConversations();
            }
        }

        function handleWsError(err) {
            clearThinkingIndicator();
            console.error('[chat] WebSocket error:', err);
            const area = document.getElementById('messagesArea');
            const div = document.createElement('div');
            div.className = 'text-center text-error font-body-sm';
            div.textContent = err.message || 'A chat connection error occurred';
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        document.getElementById('newConversationBtn').addEventListener('click', () => {
            closeMobileSidebar();
            showBlankComposeState();
        });

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content) return;

            if (!currentConversationId) {
                try {
                    const conv = await api.createConversation();
                    currentConversationId = conv.id;
                    document.getElementById('conversationTitle').textContent = displayTitle(conv.title);
                    document.getElementById('messagesArea').innerHTML = '';
                    subscribeConversation(currentConversationId, {
                        onTypingChunk: handleTypingChunk,
                        onDone: handleDone,
                    });
                    await loadConversations();
                } catch (error) {
                    console.error('Failed to create conversation:', error);
                    handleWsError({ message: 'Could not create a new conversation, please try again later' });
                    return;
                }
            }

            const area = document.getElementById('messagesArea');
            area.appendChild(renderUserBubble(content));
            input.value = '';
            area.scrollTop = area.scrollHeight;

            try {
                sendChatMessage(currentConversationId, content);
                thinkingBubbleEl = renderThinkingBubble();
                area.appendChild(thinkingBubbleEl);
                area.scrollTop = area.scrollHeight;
            } catch (error) {
                console.error('Failed to send message:', error);
                handleWsError({ message: error.message });
            }
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        connectChat({ onError: handleWsError })
            .then(() => loadConversations())
            .catch(error => console.error('Failed to connect WebSocket:', error));
    </script>
</body>

</html>
