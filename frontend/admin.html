<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin Panel - LinguistAI</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind-config.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css"/>
    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }
        .tab-active {
            border-bottom: 2px solid #004ac6;
            color: #004ac6;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col page-fade-in">
    <!-- TopNavBar - Will be replaced by navbar.js -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="flex-grow w-full px-gutter md:px-margin-desktop max-w-container-max mx-auto py-stack-lg">
        <div class="mb-stack-md">
            <h1 class="font-headline-lg text-headline-lg text-on-surface">Admin Panel</h1>
            <p class="font-body-md text-on-surface-variant mt-2">Manage topics, flashcards, and quizzes.</p>
        </div>

        <!-- Tabs -->
        <div class="border-b border-outline-variant mb-stack-md">
            <div class="flex gap-8" role="navigation" aria-label="Admin tabs">
                <button id="topicsTab" class="tab-active py-3 font-body-md transition-colors">
                    Topics
                </button>
                <button id="flashcardsTab" class="py-3 font-body-md text-on-surface-variant hover:text-on-surface transition-colors">
                    Flashcards
                </button>
                <button id="quizzesTab" class="py-3 font-body-md text-on-surface-variant hover:text-on-surface transition-colors">
                    Quizzes
                </button>
            </div>
        </div>

        <!-- Topics Panel -->
        <div id="topicsPanel" class="tab-content">
            <div class="flex justify-between items-center mb-stack-sm">
                <h2 class="font-headline-md text-headline-md text-on-surface">Manage Topics</h2>
                <button id="addTopicBtn" class="bg-primary text-on-primary font-label-md px-4 py-2 rounded-lg hover:opacity-90 transition-opacity flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg">add</span>
                    Add Topic
                </button>
            </div>

            <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-sm overflow-hidden">
                <table class="w-full">
                    <thead class="bg-surface-container-low border-b border-outline-variant/30">
                        <tr>
                            <th class="text-left p-4 font-label-md text-on-surface">ID</th>
                            <th class="text-left p-4 font-label-md text-on-surface">Title</th>
                            <th class="text-left p-4 font-label-md text-on-surface">Level</th>
                            <th class="text-left p-4 font-label-md text-on-surface">Description</th>
                            <th class="text-right p-4 font-label-md text-on-surface">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="topicsTableBody" class="divide-y divide-outline-variant/20">
                        <!-- Table rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Flashcards Panel -->
        <div id="flashcardsPanel" class="tab-content hidden">
            <div class="mb-stack-sm">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-4">Manage Flashcards</h2>
                <div class="flex gap-4 items-center">
                    <label class="font-label-md text-on-surface">Filter by Topic:</label>
                    <select id="flashcardTopicFilter" class="bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2 font-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
                        <option value="">All Topics</option>
                    </select>
                    <button id="addFlashcardBtn" class="bg-primary text-on-primary font-label-md px-4 py-2 rounded-lg hover:opacity-90 transition-opacity flex items-center gap-2 ml-auto">
                        <span class="material-symbols-outlined text-lg">add</span>
                        Add Flashcard
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="flashcardsGrid">
                <!-- Flashcard cards will be inserted here -->
            </div>
        </div>

        <!-- Quizzes Panel -->
        <div id="quizzesPanel" class="tab-content hidden">
            <div class="mb-stack-sm">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-4">Manage Quizzes</h2>
                <div class="flex gap-4 items-center">
                    <label class="font-label-md text-on-surface">Filter by Topic:</label>
                    <select id="quizTopicFilter" class="bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2 font-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
                        <option value="">All Topics</option>
                    </select>
                    <button id="addQuizBtn" class="bg-primary text-on-primary font-label-md px-4 py-2 rounded-lg hover:opacity-90 transition-opacity flex items-center gap-2 ml-auto">
                        <span class="material-symbols-outlined text-lg">add</span>
                        Add Quiz
                    </button>
                </div>
            </div>

            <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-sm overflow-hidden">
                <div id="quizzesList" class="divide-y divide-outline-variant/20">
                    <!-- Quiz items will be inserted here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for Add/Edit Topic -->
    <div id="topicModal" class="hidden fixed inset-0 bg-on-surface/50 flex items-center justify-center z-50 p-4">
        <div class="bg-surface-container-lowest rounded-xl shadow-lg w-full max-w-2xl p-stack-md">
            <div class="flex justify-between items-center mb-stack-sm">
                <h3 class="font-headline-md text-headline-md text-on-surface" id="topicModalTitle">Add Topic</h3>
                <button id="closeTopicModal" class="text-on-surface-variant hover:text-on-surface">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <form id="topicForm" class="flex flex-col gap-stack-sm">
                <input type="hidden" id="topicId"/>
                <div>
                    <label class="block font-label-md text-on-surface mb-unit" for="topicTitle">Title</label>
                    <input id="topicTitle" type="text" required class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"/>
                </div>
                <div>
                    <label class="block font-label-md text-on-surface mb-unit" for="topicDescription">Description</label>
                    <textarea id="topicDescription" rows="3" required class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"></textarea>
                </div>
                <div>
                    <label class="block font-label-md text-on-surface mb-unit" for="topicLevel">Level</label>
                    <select id="topicLevel" required class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
                        <option value="BEGINNER">Beginner</option>
                        <option value="INTERMEDIATE">Intermediate</option>
                        <option value="ADVANCED">Advanced</option>
                    </select>
                </div>
                <div>
                    <label class="block font-label-md text-on-surface mb-unit" for="topicImageUrl">Image URL</label>
                    <input id="topicImageUrl" type="url" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"/>
                </div>
                <div class="flex justify-end gap-4 mt-stack-sm">
                    <button type="button" id="cancelTopicBtn" class="px-6 py-2 font-label-md text-on-surface-variant hover:text-on-surface border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="px-6 py-2 font-label-md bg-primary text-on-primary rounded-lg hover:opacity-90 transition-opacity">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full border-t border-outline-variant bg-surface mt-auto">
        <div class="flex flex-col md:flex-row justify-between items-center px-gutter py-stack-md max-w-container-max mx-auto">
            <div class="font-headline-md font-bold text-primary mb-4 md:mb-0">
                LinguistAI
            </div>
            <div class="text-on-surface-variant font-label-md">
                © 2024 LinguistAI. All rights reserved.
            </div>
        </div>
    </footer>

    <script type="module">
        import { checkAdmin, clearAuth } from './js/auth.js';
        import * as api from './js/api.js';
        import { initNavBar } from './js/navbar.js';

        // Admin guard
        checkAdmin();

        console.log('[Admin] Page loaded, waiting for navbar...');

        // Initialize navbar first and wait for it
        initNavBar('admin');

        let currentTab = 'topics';
        let editingTopicId = null;

        // Tab switching
        function switchTab(tab) {
            currentTab = tab;

            // Update tab buttons - use the admin tabs container selector
            document.querySelectorAll('[role="navigation"][aria-label="Admin tabs"] button').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-on-surface-variant');
            });
            document.getElementById(`${tab}Tab`).classList.add('tab-active');
            document.getElementById(`${tab}Tab`).classList.remove('text-on-surface-variant');

            // Update panels
            document.querySelectorAll('.tab-content').forEach(panel => {
                panel.classList.add('hidden');
            });
            document.getElementById(`${tab}Panel`).classList.remove('hidden');

            // Load data
            if (tab === 'topics') loadTopics();
            else if (tab === 'flashcards') loadFlashcards();
            else if (tab === 'quizzes') loadQuizzes();
        }

        document.getElementById('topicsTab').addEventListener('click', () => switchTab('topics'));
        document.getElementById('flashcardsTab').addEventListener('click', () => switchTab('flashcards'));
        document.getElementById('quizzesTab').addEventListener('click', () => switchTab('quizzes'));

        // Load Topics
        async function loadTopics() {
            try {
                console.log('[Admin] loadTopics() called');
                const result = await api.adminGetTopics();
                console.log('[Admin] Topics loaded:', result.content.length, 'topics');
                const tbody = document.getElementById('topicsTableBody');

                if (!tbody) {
                    console.error('[Admin] topicsTableBody not found!');
                    return;
                }

                tbody.innerHTML = '';

                if (result.content.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-on-surface-variant">No topics found</td></tr>';
                    return;
                }

                result.content.forEach(topic => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-surface-container-low/50 transition-colors';
                    row.innerHTML = `
                        <td class="p-4 font-body-md">${topic.id}</td>
                        <td class="p-4 font-body-md font-semibold">${topic.title}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded-full font-label-sm ${getLevelColor(topic.level)}">
                                ${topic.level}
                            </span>
                        </td>
                        <td class="p-4 font-body-md text-on-surface-variant">${topic.description.substring(0, 50)}...</td>
                        <td class="p-4 text-right">
                            <button onclick="editTopic(${topic.id})" class="text-primary hover:text-surface-tint p-2 rounded transition-colors">
                                <span class="material-symbols-outlined text-lg">edit</span>
                            </button>
                            <button onclick="deleteTopic(${topic.id})" class="text-error hover:text-error/80 p-2 rounded transition-colors">
                                <span class="material-symbols-outlined text-lg">delete</span>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                showToast('Failed to load topics', 'error');
            }
        }

        function getLevelColor(level) {
            switch(level) {
                case 'BEGINNER': return 'bg-secondary/10 text-secondary';
                case 'INTERMEDIATE': return 'bg-primary/10 text-primary';
                case 'ADVANCED': return 'bg-tertiary/10 text-tertiary';
                default: return 'bg-surface-container text-on-surface-variant';
            }
        }

        // Topic Modal
        document.getElementById('addTopicBtn').addEventListener('click', () => {
            editingTopicId = null;
            document.getElementById('topicModalTitle').textContent = 'Add Topic';
            document.getElementById('topicForm').reset();
            document.getElementById('topicModal').classList.remove('hidden');
        });

        document.getElementById('closeTopicModal').addEventListener('click', () => {
            document.getElementById('topicModal').classList.add('hidden');
        });

        document.getElementById('cancelTopicBtn').addEventListener('click', () => {
            document.getElementById('topicModal').classList.add('hidden');
        });

        document.getElementById('topicForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                title: document.getElementById('topicTitle').value,
                description: document.getElementById('topicDescription').value,
                level: document.getElementById('topicLevel').value,
                imageUrl: document.getElementById('topicImageUrl').value || `https://picsum.photos/seed/${Date.now()}/400/240`
            };

            try {
                if (editingTopicId) {
                    await api.adminUpdateTopic(editingTopicId, data);
                    showToast('Topic updated successfully!', 'success');
                } else {
                    await api.adminCreateTopic(data);
                    showToast('Topic created successfully!', 'success');
                }
                document.getElementById('topicModal').classList.add('hidden');
                loadTopics();
            } catch (error) {
                showToast(error.message || 'Failed to save topic', 'error');
            }
        });

        // Edit/Delete Topic (exposed to window for inline onclick)
        window.editTopic = async (id) => {
            editingTopicId = id;
            document.getElementById('topicModalTitle').textContent = 'Edit Topic';

            try {
                const topic = await api.getTopicDetail(id);
                document.getElementById('topicTitle').value = topic.title;
                document.getElementById('topicDescription').value = topic.description;
                document.getElementById('topicLevel').value = topic.level;
                document.getElementById('topicImageUrl').value = topic.imageUrl || '';
                document.getElementById('topicModal').classList.remove('hidden');
            } catch (error) {
                showToast('Failed to load topic', 'error');
            }
        };

        window.deleteTopic = async (id) => {
            if (!confirm('Are you sure you want to delete this topic?')) return;

            try {
                await api.adminDeleteTopic(id);
                showToast('Topic deleted successfully!', 'success');
                loadTopics();
            } catch (error) {
                showToast(error.message || 'Failed to delete topic', 'error');
            }
        };

        // Load Flashcards (simplified)
        async function loadFlashcards() {
            const grid = document.getElementById('flashcardsGrid');
            grid.innerHTML = '<div class="col-span-full text-center p-stack-lg text-on-surface-variant">Flashcard management coming soon...</div>';
        }

        // Load Quizzes (simplified)
        async function loadQuizzes() {
            const list = document.getElementById('quizzesList');
            list.innerHTML = '<div class="p-stack-lg text-center text-on-surface-variant">Quiz management coming soon...</div>';
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Are you sure you want to logout?')) {
                clearAuth();
                window.location.href = 'login.html';
            }
        });

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Initialize - load topics on page load
        // Wait for DOM to be fully ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializePage);
        } else {
            initializePage();
        }

        function initializePage() {
            console.log('[Admin] Initializing admin page...');
            console.log('[Admin] Document ready state:', document.readyState);
            console.log('[Admin] Topics panel exists?', !!document.getElementById('topicsPanel'));
            console.log('[Admin] Topics panel visible?', !document.getElementById('topicsPanel')?.classList.contains('hidden'));
            console.log('[Admin] tbody element exists?', !!document.getElementById('topicsTableBody'));

            // Load topics immediately
            console.log('[Admin] Calling loadTopics()...');
            loadTopics();
        }
    </script>
</body>
</html>
