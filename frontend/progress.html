<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>LinguistAI - Learning Progress</title>
    <script>
      if (localStorage.getItem('linguistai_theme') === 'dark' ||
          (!localStorage.getItem('linguistai_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind-config.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col page-fade-in">

    <div id="app-sidebar-container"></div>
    <div id="app-content" class="min-h-screen flex flex-col">
    <div id="app-topbar-container"></div>

    <!-- Main Content -->
    <main class="flex-grow pt-stack-md pb-stack-lg px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto w-full flex flex-col gap-stack-lg">
        <!-- Page Header -->
        <header>
            <h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Your Learning Progress 📊</h1>
            <p class="font-body-md text-body-md text-on-surface-variant">Track your topic mastery and review recent quiz performances.</p>
        </header>
        
        <!-- Gamification: XP & Streak -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-6 shadow-sm">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-12 h-12 bg-tertiary-fixed rounded-2xl flex items-center justify-center">
                        <span class="material-symbols-outlined text-tertiary text-[28px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
                    </div>
                    <div>
                        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase">Level <span id="levelValue">—</span></p>
                        <p class="font-headline-lg text-headline-lg text-on-surface"><span id="xpValue">—</span> XP</p>
                    </div>
                </div>
                <div class="w-full bg-surface-container-low rounded-full h-2.5">
                    <div id="levelBar" class="progress-bar-fill bg-tertiary h-2.5 rounded-full" style="width: 0%"></div>
                </div>
                <p id="levelHint" class="font-label-sm text-label-sm text-on-surface-variant mt-2">&nbsp;</p>
            </div>

            <div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-6 shadow-sm">
                <div class="flex items-center gap-3 mb-4">
                    <div id="streakIconBox" class="w-12 h-12 bg-surface-container-high rounded-2xl flex items-center justify-center">
                        <span id="streakIcon" class="material-symbols-outlined text-on-surface-variant text-[28px]" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
                    </div>
                    <div>
                        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase">Day streak</p>
                        <p id="streakValue" class="font-headline-lg text-headline-lg text-on-surface-variant">—</p>
                    </div>
                </div>
                <p id="streakHint" class="font-label-sm text-label-sm text-on-surface-variant">&nbsp;</p>
                <div class="flex items-center gap-2 mt-3">
                    <span id="freezeIcon" class="shrink-0 text-outline"></span>
                    <p id="freezeHint" class="font-label-sm text-label-sm text-on-surface-variant">&nbsp;</p>
                </div>
            </div>
        </section>

        <p id="gamificationError" class="hidden text-center text-error font-body-md"></p>

        <!-- Stats Summary -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-6 shadow-sm">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-12 h-12 bg-primary-fixed rounded-2xl flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">school</span>
                    </div>
                    <div>
                        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase">Total Topics</p>
                        <p id="totalTopics" class="font-headline-lg text-headline-lg text-on-surface">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-6 shadow-sm">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-12 h-12 bg-secondary-fixed rounded-2xl flex items-center justify-center">
                        <span class="material-symbols-outlined text-secondary text-[28px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    </div>
                    <div>
                        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase">Completed</p>
                        <p id="completedTopics" class="font-headline-lg text-headline-lg text-secondary">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-6 shadow-sm">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-12 h-12 bg-tertiary-fixed rounded-2xl flex items-center justify-center">
                        <span class="material-symbols-outlined text-tertiary text-[28px]" style="font-variation-settings: 'FILL' 1;">pending</span>
                    </div>
                    <div>
                        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase">In Progress</p>
                        <p id="inProgressTopics" class="font-headline-lg text-headline-lg text-tertiary">0</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Topic Progress List -->
        <section>
            <h2 class="font-headline-md text-headline-md text-on-surface mb-stack-md flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">school</span>
                Topic Progress
            </h2>
            <div id="progressList" class="space-y-4">
                <!-- Progress items loaded dynamically -->
            </div>
        </section>

        <!-- Quiz History -->
        <section>
            <h2 class="font-headline-md text-headline-md text-on-surface mb-stack-md flex items-center gap-2">
                <span class="material-symbols-outlined text-secondary">quiz</span>
                Recent Quiz Attempts
            </h2>
            <div id="quizHistoryList" class="space-y-4">
                <!-- Quiz history loaded dynamically -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="app-footer-container"></div>
    </div>

    <script type="module">
        import { checkAuth } from './js/auth.js';
        import * as api from './js/api.js';
        import { initNavBar } from './js/navbar.js';
        import { initFooter } from './js/footer.js';
        import { el } from './js/ui.js';

        checkAuth();
        initNavBar('progress');
        initFooter();
        
        function renderProgressSkeletons(count = 3) {
            document.getElementById('progressList').innerHTML = Array.from({ length: count }).map(() => `
                <div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-6">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex-1 flex flex-col gap-2">
                            <div class="skeleton h-6 w-1/3"></div>
                            <div class="skeleton h-4 w-1/4"></div>
                        </div>
                        <div class="w-full md:w-64">
                            <div class="skeleton h-2 w-full rounded-full"></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderQuizHistorySkeletons(count = 3) {
            document.getElementById('quizHistoryList').innerHTML = Array.from({ length: count }).map(() => `
                <div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-6">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex-1 flex flex-col gap-2">
                            <div class="skeleton h-6 w-1/3"></div>
                            <div class="skeleton h-4 w-1/2"></div>
                        </div>
                        <div class="flex flex-col gap-2 items-end">
                            <div class="skeleton h-4 w-20"></div>
                            <div class="skeleton h-4 w-16"></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        const SHIELD_OK = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V5l-8-3z"/></svg>`;
        const SHIELD_BROKEN = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path transform="translate(-1.5 0) rotate(-6 8 12)" d="M12 2 4 5v6c0 5 3.5 9.5 8 11l-1-7 2-4-2-4 1-5z"/>
            <path transform="translate(1.5 0) rotate(6 16 12)" d="M12 2 11 7l2 4-2 4 1 7c4.5-1.5 8-6 8-11V5l-8-3z"/>
        </svg>`;
        
        async function loadGamification() {
            try {
                const s = await api.getMyStats();

                document.getElementById('levelValue').textContent = s.level;
                document.getElementById('xpValue').textContent = s.totalXp.toLocaleString();

                // Level L trải từ 100*(L-1)^2 đến 100*L^2 XP (khớp công thức ở server)
                const base = 100 * (s.level - 1) ** 2;
                const span = 100 * (2 * s.level - 1);
                const pct = Math.max(0, Math.min(100, Math.round((s.totalXp - base) / span * 100)));
                document.getElementById('levelBar').style.width = pct + '%';
                document.getElementById('levelHint').textContent =
                    `${s.xpToNextLevel.toLocaleString()} XP to level ${s.level + 1}`;

                const lit = s.activeToday && s.currentStreak > 0;

                const value = document.getElementById('streakValue');
                value.textContent = s.currentStreak;
                value.className = 'font-headline-lg text-headline-lg ' + (lit ? 'text-error' : 'text-on-surface-variant');
                document.getElementById('streakIconBox').className =
                    'w-12 h-12 rounded-2xl flex items-center justify-center ' + (lit ? 'bg-error-container' : 'bg-surface-container-high');
                document.getElementById('streakIcon').className =
                    'material-symbols-outlined text-[28px] ' + (lit ? 'text-error' : 'text-on-surface-variant');

                document.getElementById('streakHint').textContent =
                    s.activeToday ? `You practiced today. Longest streak: ${s.longestStreak}`
                    : s.currentStreak > 0 ? 'Practice today to keep your streak alive!'
                    : `Start a new streak today. Longest streak: ${s.longestStreak}`;

                const freezeIcon = document.getElementById('freezeIcon');
                freezeIcon.innerHTML = s.freezeAvailable ? SHIELD_OK : SHIELD_BROKEN; // hằng số tĩnh, không có dữ liệu server
                freezeIcon.className = 'shrink-0 ' + (s.freezeAvailable ? 'text-secondary' : 'text-outline');
                document.getElementById('freezeHint').textContent = s.freezeAvailable
                    ? 'Streak freeze ready: it will cover one missed day this week'
                    : 'Streak freeze used this week. It renews on Monday';
            } catch (error) {
                console.error('[loadGamification]', error);
                const el2 = document.getElementById('gamificationError');
                el2.textContent = 'Failed to load XP and streak: ' + error.message;
                el2.classList.remove('hidden');
            }
        }

        async function loadProgress() {
            renderProgressSkeletons();
            try {
                const progress = await api.getProgress();

                const total = progress.length;
                const completed = progress.filter(p => p.status === 'COMPLETED').length;
                const inProgress = progress.filter(p => p.status === 'IN_PROGRESS').length;

                document.getElementById('totalTopics').textContent = total;
                document.getElementById('completedTopics').textContent = completed;
                document.getElementById('inProgressTopics').textContent = inProgress;

                const list = document.getElementById('progressList');
                list.innerHTML = '';

                if (progress.length === 0) {
                    list.innerHTML = '<p class="text-center text-on-surface-variant font-body-md py-8">No progress yet — start learning a topic to see it here!</p>';
                    return;
                }

                const statusColors = {
                    'COMPLETED': 'bg-secondary-fixed text-on-secondary-fixed',
                    'IN_PROGRESS': 'bg-tertiary-fixed text-on-tertiary-fixed',
                    'NOT_STARTED': 'bg-surface-container-high text-on-surface-variant'
                };

                progress.forEach(item => {
                    const available = item.topicAvailable !== false;

                    const card = el('div', 'bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-6 transition-all '
                        + (available ? 'hover:border-primary hover:-translate-y-1 cursor-pointer' : 'opacity-60'));
                    if (available) {
                        card.onclick = () => { window.location.href = `topic-detail.html?id=${encodeURIComponent(item.topicId)}`; };
                    }

                    const row = el('div', 'flex flex-col md:flex-row md:items-center justify-between gap-4');

                    const left = el('div', 'flex-1');
                    const titleRow = el('div', 'flex items-center gap-3 mb-2 flex-wrap');
                    titleRow.appendChild(el('h3', 'font-headline-md text-headline-md text-on-surface', item.topicTitle));
                    titleRow.appendChild(el('span',
                        'px-3 py-1 rounded-full font-label-sm text-label-sm font-bold ' + (statusColors[item.status] || statusColors.NOT_STARTED),
                        item.status.replace('_', ' ')));
                    if (!available) {
                        titleRow.appendChild(el('span',
                            'px-3 py-1 rounded-full font-label-sm text-label-sm font-bold border-2 border-outline-variant text-on-surface-variant',
                            'Unavailable'));
                    }
                    left.appendChild(titleRow);
                    left.appendChild(el('p', 'font-label-sm text-label-sm text-on-surface-variant',
                        'Last updated: ' + new Date(item.updatedAt).toLocaleDateString()));

                    const right = el('div', 'w-full md:w-64');
                    const labels = el('div', 'flex justify-between items-center mb-1');
                    labels.appendChild(el('span', 'font-label-sm text-label-sm text-on-surface-variant', 'Progress'));
                    labels.appendChild(el('span', 'font-label-sm text-label-sm text-primary font-bold', item.progressPercent + '%'));
                    const track = el('div', 'w-full bg-surface-container-low rounded-full h-2.5');
                    const fill = el('div', 'progress-bar-fill bg-primary h-2.5 rounded-full');
                    fill.style.width = Number(item.progressPercent) + '%';
                    track.appendChild(fill);
                    right.appendChild(labels);
                    right.appendChild(track);

                    row.appendChild(left);
                    row.appendChild(right);
                    card.appendChild(row);
                    list.appendChild(card);
                });
            } catch (error) {
                console.error('Failed to load progress:', error);
                document.getElementById('progressList').innerHTML = '<p class="text-center text-error">Failed to load progress</p>';
            }
        }

        async function loadQuizHistory() {
            renderQuizHistorySkeletons();
            try {
                const data = await api.getMyRecentQuizAttempts(0, 5);

                const list = document.getElementById('quizHistoryList');
                list.innerHTML = '';

                if (data.content.length === 0) {
                    list.innerHTML = '<p class="text-center text-on-surface-variant font-body-md py-8">No quiz attempts yet</p>';
                    return;
                }

                data.content.forEach(attempt => {
                    const card = el('div', 'bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-6');
                    const scoreClass = attempt.score >= 80 ? 'text-secondary' : attempt.score >= 50 ? 'text-primary' : 'text-error';
                    const when = new Date(attempt.completedAt);

                    const row = el('div', 'flex flex-col md:flex-row md:items-center justify-between gap-4');
                    const left = el('div', 'flex-1');
                    left.appendChild(el('p', `font-headline-md text-headline-md ${scoreClass} mb-1`, `Score: ${attempt.score}%`));
                    left.appendChild(el('p', 'font-body-md text-body-md text-on-surface-variant',
                        `${attempt.correctAnswers} / ${attempt.totalQuestions} correct`));
                    const right = el('div', 'text-right');
                    right.appendChild(el('p', 'font-label-sm text-label-sm text-on-surface-variant', when.toLocaleDateString()));
                    right.appendChild(el('p', 'font-label-sm text-label-sm text-on-surface-variant', when.toLocaleTimeString()));

                    row.appendChild(left);
                    row.appendChild(right);
                    card.appendChild(row);
                    list.appendChild(card);
                });
            } catch (error) {
                console.error('Failed to load quiz history:', error);
                document.getElementById('quizHistoryList').innerHTML = '<p class="text-center text-error">Failed to load quiz history</p>';
            }
        }

        loadGamification();
        loadProgress();
        loadQuizHistory();
    </script>
</body>
</html>
