<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopNavBar: Suppressed for Transactional (Login) Page as per Shared Components Logic -->
<main class="flex-grow flex items-center justify-center p-gutter">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_10px_15px_-3px_rgba(0,0,0,0.05)] w-full max-w-md p-stack-md transition-all duration-300 hover:shadow-[0_20px_25px_-5px_rgba(0,0,0,0.1)]">
<div class="text-center mb-stack-md">
<h1 class="font-headline-lg text-headline-lg text-primary mb-unit">LinguistAI</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back. Please login to your account.</p>
</div>
<form class="flex flex-col gap-stack-sm">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="username">Username or Email address</label>
<input class="w-full bg-[#F1F5F9] border border-[#E2E8F0] rounded-lg px-4 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all duration-200 placeholder-outline-variant" id="username" placeholder="Enter your username or email" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="password">Password</label>
<input class="w-full bg-[#F1F5F9] border border-[#E2E8F0] rounded-lg px-4 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all duration-200 placeholder-outline-variant" id="password" placeholder="Enter your password" type="password"/>
<div class="flex justify-end mt-unit">
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
</div>
<!-- Note: The prompt asks for brand teal, but the design system specifies Primary Filled Coral (#F43F5E) for primary actions. Sticking to design system mandate. -->
<button class="w-full bg-[#F43F5E] text-white font-label-md text-label-md rounded-lg py-3 mt-stack-sm hover:opacity-90 transition-opacity flex items-center justify-center gap-2 shadow-sm" type="submit">
                    Login
                    <span class="material-symbols-outlined" data-icon="login" style="font-size: 18px;">login</span>
</button>
</form>
<div class="text-center mt-stack-md pt-stack-sm border-t border-outline-variant/50">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? <a class="text-primary font-bold hover:underline transition-all" href="#">Sign up</a>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full border-t border-outline-variant dark:border-outline bg-surface dark:bg-on-background mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center px-gutter py-stack-md max-w-container-max mx-auto">
<div class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed mb-4 md:mb-0">

<a class="text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed font-label-md text-label-md hover:underline transition-all opacity-90 hover:opacity-100" href="#">Terms of Service</a>
<a class="text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed font-label-md text-label-md hover:underline transition-all opacity-90 hover:opacity-100" href="#">Help Center</a>
