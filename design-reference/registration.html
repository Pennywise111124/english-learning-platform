<style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: theme('colors.background');
        }
        main {
            flex: 1;
        }

<body class="text-on-background font-body-md text-body-md">
<!-- Suppressed TopNavBar due to transactional intent -->
<main class="flex items-center justify-center py-stack-lg px-margin-mobile md:px-margin-desktop">
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-lg w-full max-w-md p-stack-md flex flex-col gap-stack-md hover:shadow-xl transition-shadow duration-300">
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-unit">Create your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join our community of English learners.</p>
</div>
<form class="flex flex-col gap-stack-sm" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="username">Username</label>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg px-unit py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all" id="username" name="username" placeholder="johndoe" required="" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">Email address</label>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg px-unit py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all" id="email" name="email" placeholder="john@example.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg px-unit py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="confirm-password">Confirm password</label>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg px-unit py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="mt-unit w-full bg-[#0D9488] hover:bg-[#0F766E] text-white font-label-md text-label-md py-3 rounded-lg shadow-sm hover:shadow-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-[#0D9488]/50 focus:ring-offset-2" type="submit">
                    Sign Up
                </button>
</form>
<div class="text-center mt-unit">
<p class="font-label-md text-label-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary hover:text-primary-container font-semibold transition-colors" href="#">Login</a>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface-container-low dark:bg-surface-container-lowest w-full py-stack-md mt-auto border-t border-outline-variant/50">
<div class="flex flex-col md:flex-row justify-between items-center px-margin-desktop max-w-container-max mx-auto gap-stack-sm">
<div class="font-headline-sm text-headline-sm font-bold text-on-surface dark:text-on-surface">
                LinguistAI
            </div>
<div class="flex gap-gutter font-label-md text-label-md">
<a class="text-on-surface-variant hover:text-primary transition-colors opacity-90 hover:opacity-100" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-primary transition-colors opacity-90 hover:opacity-100" href="#">Terms of Service</a>
<a class="text-on-surface-variant hover:text-primary transition-colors opacity-90 hover:opacity-100" href="#">Help Center</a>
<a class="text-on-surface-variant hover:text-primary transition-colors opacity-90 hover:opacity-100" href="#">Contact Us</a>
</div>
<div class="font-label-md text-label-md text-on-surface-variant opacity-90">
                © 2024 LinguistAI. All rights reserved.
            </div>
</div>
</footer>
