resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;          # khớp giới hạn audio 10MB

    root /usr/share/nginx/html;
    index index.html;

    set $backend http://backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # GHI ĐÈ, không dùng $proxy_add_x_forwarded_for
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/     { proxy_pass $backend; }
    location /uploads/ { proxy_pass $backend; }
    location /ws/ {
        proxy_pass $backend;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /actuator/ { return 404; }              # chỉ dùng nội bộ

    location / {
        add_header Cache-Control "no-cache";         # tránh lỗi "bản JS cũ trong cache"
        try_files $uri $uri/ =404;
    }
}