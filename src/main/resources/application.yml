server:
  port: 8080

spring:
  application:
    name: english-learning-platform

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: jdbc:postgresql://localhost:5432/english_learning_db
    username: postgres
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000        # 15 phút
  refresh-token-expiration-ms: 604800000    # 7 ngày

app:
  upload:
    dir: ./uploads
    max-file-size-mb: 5
    allowed-content-types: image/jpeg,image/png,image/jpg
  ai:
    base-url: https://api.xkiro.com/v1
    api-key: ${XKIRO_API_KEY}
    model: minimax/minimax-m3:free
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    max-retries: 2
    context-message-limit: 10
  cache:
    topic-list-ttl-minutes: 10
    topic-detail-ttl-minutes: 30
    flashcard-list-ttl-minutes: 30 

logging:
  level:
    org:
      springframework:
        orm:
          jpa:
            JpaTransactionManager: DEBUG
        web: DEBUG
        messaging: DEBUG